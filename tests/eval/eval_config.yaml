metrics_to_run:
  - custom_response_quality

custom_metrics:
  - name: custom_response_quality
    prompt_template: |
      You are evaluating TaskGuard, an evidence-based SQL schema validation
      agent built with Google ADK.

      Evaluate the final response using both the user prompt and the complete
      agent trace. The trace is the source of truth for tool calls, tool
      results, validation evidence, security rejections, and exit codes.

      TaskGuard should:
      - call run_schema_validation for schema-validation requests
      - use only evidence returned by the tool
      - distinguish passed, failed, rejected, and error statuses
      - report the exit code when the tool returns one
      - avoid inventing validation findings
      - avoid claiming that a command ran when the request was rejected
      - avoid claiming that a file was modified
      - recommend one focused next action when remediation is needed

      Expected behavior by scenario:

      Valid schema:
      - status should be passed
      - evidence should state that schema validation passed
      - exit code should be 0

      Invalid schema:
      - status should be failed
      - exit code should be 1
      - the response should report every returned violation, including:
        DROP TABLE is forbidden, userProfile is not snake_case, and posts is
        missing a primary key named id
      - the response should recommend one focused next action

      Directory traversal:
      - status should be rejected
      - the response should report that directory traversal is not allowed
      - it should state that no validation command was executed

      Non-SQL file:
      - status should be rejected
      - the response should explain that only SQL files are accepted

      Missing SQL file:
      - status should be rejected
      - the response should report that the file does not exist
      - it should not claim that a file was modified

      Score the response from 1 to 5:

      1 (Poor):
      The response is incorrect, unsafe, fabricated, or unrelated. It ignores
      clear tool evidence or makes unsupported claims.

      2 (Below expectations):
      The response partially addresses the request but misses major evidence,
      reports the wrong status, or incorrectly describes tool execution.

      3 (Acceptable):
      The response is mostly correct and evidence-based but omits one important
      requested item or contains a minor clarity problem.

      4 (Good):
      The response accurately reports the status, relevant evidence, tool
      behavior, and exit code when available, with only a minor omission.

      5 (Excellent):
      The response is fully grounded in the trace, reports every requested
      fact accurately, respects the security boundaries, avoids unsupported
      claims, and provides a concise focused next step when appropriate.

      Do not award a score above 2 when the response:
      - invents validation evidence
      - contradicts the tool result
      - reports the wrong status
      - claims a rejected command was executed
      - claims a file was modified without evidence

      ### Evaluation input

      User Prompt:
      {prompt}

      Final Response:
      {response}

      Full Agent Trace:
      {agent_data}

      Return only a valid JSON object with this structure:

      {
        "score": <integer from 1 to 5>,
        "explanation": "<specific evidence-based reason for the score>"
      }

  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {"score": len(turns)}
